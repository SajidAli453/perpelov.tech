<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="svgTitle svgDesc">
<title id="svgTitle">A phone with a text message and a clock</title>
<desc id="svgDesc">A simple drawing of a Samsung Galaxy style phone. On its screen is a text message that says Happy birthday, Hamza! and a small clock showing eight o'clock. A calendar page beside the phone shows Friday.</desc>
<rect width="800" height="450" fill="#123524"/>
<rect x="70" y="40" width="330" height="370" rx="36" fill="#e8e6d9"/>
<circle cx="235" cy="80" r="8" fill="#1e5c3a"/>
<rect x="100" y="110" width="270" height="86" rx="16" fill="#ffffff" stroke="#1e5c3a" stroke-width="3"/>
<text x="235" y="143" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#123524" text-anchor="middle">Happy birthday,</text>
<text x="235" y="172" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#123524" text-anchor="middle">Hamza!</text>
<circle cx="235" cy="262" r="52" fill="none" stroke="#1e5c3a" stroke-width="6"/>
<circle cx="235" cy="262" r="5" fill="#1e5c3a"/>
<path d="M 235 262 L 235 224" stroke="#1e5c3a" stroke-width="6" stroke-linecap="round"/>
<path d="M 235 262 L 260 276" stroke="#1e5c3a" stroke-width="6" stroke-linecap="round"/>
<text x="235" y="355" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#123524" text-anchor="middle">8:00 AM</text>
<rect x="450" y="110" width="280" height="230" rx="16" fill="#ffffff" stroke="#1e5c3a" stroke-width="3"/>
<rect x="450" y="110" width="280" height="56" rx="16" fill="#1e5c3a"/>
<text x="590" y="147" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">FRIDAY</text>
<text x="590" y="245" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#123524" text-anchor="middle">14</text>
<text x="590" y="300" font-family="Arial, sans-serif" font-size="20" fill="#123524" text-anchor="middle">November</text>
<text x="400" y="420" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#e8e6d9" text-anchor="middle">Write it tonight. It goes at 8:00 in the morning.</text>
</svg>
